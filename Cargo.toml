[workspace]
resolver = "2"
members = [
    "crates/ro-core",
    "crates/ro-packets",
    "crates/ro-engine",
    "crates/ro-db",
    "crates/ro-mechanics",
    "crates/ro-persistence",
    "crates/ro-scripting",
    "bins/login-server",
    "bins/char-server",
    "bins/map-server",
    "tools/proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ro-core = { path = "crates/ro-core" }
ro-packets = { path = "crates/ro-packets" }
ro-engine = { path = "crates/ro-engine" }
ro-db = { path = "crates/ro-db" }
ro-mechanics = { path = "crates/ro-mechanics" }
ro-persistence = { path = "crates/ro-persistence" }
ro-scripting = { path = "crates/ro-scripting" }

tokio = { version = "1.53", features = ["full"] }
bytes = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { version = "1.16", features = ["union", "const_generics"] }
rustc-hash = "2.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json"] }
tokio-util = { version = "0.7", features = ["codec"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

[workspace.lints.clippy]
# Production code must not panic on bad input; drop the session instead.
# Test code is exempted via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Whole-program optimization: inlines across crates (e.g. ro-db grid reads in ro-engine's A*).
# Slower release builds only; dev builds and ./verify.sh are unaffected.
lto = "fat"
codegen-units = 1
